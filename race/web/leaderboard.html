<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Air-time leaderboard</title>
<!-- Arcade font for the race finish; falls back to a monospace font offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<!-- Mona flying: frame 3 of badge/apps/flappy_mona/assets/mona.png in badger/home. -->
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAABLUlEQVR42q1W0RWDIAy8+BxFhmEAukUdxjHKAA6Du6QfNhoRBKr5MS8+7nIhAYAKY2ZuiTcZM/N7+HAMlovH1pXAR+MBAKPxW8a5eBOBBpmCK8ZzRiXwGpuCAxFRc4lq7apM3d3sSySPKLiyPhWcF8AOiVpPmezHxja1w0pSA1761+naSw1FQUyysrs9Y+1nprtPbayA6++BY/GAcbsPt2204Enb9gBARKSZDXmclJjfz8XD/gZsptfm68GTjiI9HPGEColWFEJmk+26Rq8/KIhViK+VAIAxaYLA7rA+qaB0HGtFAqqTi9dJjGqO6xg8zvzWcW3In7to2FXdug9SA5jy/yLIZQ8A81yfVJWC07CZh/ZAQHXHrIEHFcTXYmAHa69vsaYXReowbHmufAGb4QJocOy+TwAAAABJRU5ErkJggg==">
<style>
  /* Light theme of badger.github.io (src/styles/globals.css, :root.light). */
  :root {
    --background: hsl(140 13% 95.5%); --foreground: hsl(137 11% 7%); --card: #fff;
    --primary: hsl(137 91% 25%); --muted: hsl(140 12% 91%); --muted-foreground: hsl(138 4% 36%);
    --border: hsl(140 9% 82%); --input: hsl(140 9% 78%); --control-hover: hsl(140 12% 93%);
    --destructive: hsl(356 72% 47%); --control-danger: hsl(353 80% 97%); --control-danger-hover: hsl(353 75% 94%);
    --page-glow: rgba(15, 191, 62, 0.09); --page-sheen: rgba(255, 255, 255, 0.7); --grid-dot: rgba(8, 135, 43, 0.2);
    --surface-shadow: 0 1px 2px rgba(16, 20, 17, 0.04), 0 10px 30px rgba(16, 20, 17, 0.06);
    --sans: "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Mona Sans SemiCondensed", "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Monaspace Neon", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 0.7rem;
    color-scheme: light;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  body {
    margin:0; min-width:320px; font:16px/1.6 var(--sans); color:var(--foreground); background:var(--background);
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle at 78% 0%, var(--page-glow), transparent 26rem),
      linear-gradient(180deg, var(--page-sheen), transparent 26rem);
    background-attachment: fixed;
  }
  ::selection { color:#fff; background:var(--primary); }
  header {
    position:sticky; top:0; z-index:10; height:4.5rem; padding:0 2rem; display:flex; gap:1rem; align-items:center;
    border-bottom:1px solid color-mix(in srgb, var(--border) 80%, transparent);
    background:color-mix(in srgb, var(--background) 90%, transparent); backdrop-filter:blur(24px);
  }
  header h1 { font:600 1.5rem/1 var(--display); letter-spacing:-0.025em; margin:0; display:flex; align-items:center; gap:.6rem; }
  header h1 .mark { width:2.25rem; height:2.25rem; border-radius:.6rem; display:grid; place-items:center; background:var(--foreground); }
  #conn { flex:1; }
  .eyebrow, #conn { font:500 .68rem/1 var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--muted-foreground); }
  button, select {
    font:500 .72rem/1 var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--foreground);
    background:var(--card); border:1px solid var(--input); border-radius:calc(var(--radius) - 2px);
    height:2.5rem; padding:0 1rem; cursor:pointer; transition:border-color 150ms, background-color 150ms;
  }
  select { padding-right:.6rem; }
  button:hover:not(:disabled), select:hover { background:var(--control-hover); border-color:color-mix(in srgb, var(--primary) 60%, transparent); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:default; }
  button.danger { color:var(--destructive); background:var(--control-danger); border-color:color-mix(in srgb, var(--destructive) 35%, transparent); }
  button.danger:hover { background:var(--control-danger-hover); border-color:var(--destructive); }
  button.icon { width:2.5rem; padding:0; display:grid; place-items:center; }
  button.icon svg { width:1.25rem; height:1.25rem; fill:currentColor; pointer-events:none; }
  main { max-width:1400px; margin:0 auto; padding:1.5rem 2rem 2rem; }
  .surface { background:color-mix(in srgb, var(--card) 80%, transparent); border:1px solid color-mix(in srgb, var(--border) 80%, transparent); border-radius:.75rem; box-shadow:var(--surface-shadow); }
  #chartwrap { position:relative; height:min(55vh, 520px); overflow:hidden; }
  #chartwrap::before { content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle, var(--grid-dot) 1px, transparent 1px); background-size:22px 22px; mask-image:linear-gradient(180deg, black, transparent 82%); -webkit-mask-image:linear-gradient(180deg, black, transparent 82%); }
  #chart { position:relative; width:100%; height:100%; display:block; }
  .dots { height:1px; margin:1.5rem 0; background-image:radial-gradient(circle, rgba(16, 20, 17, 0.35) 1px, transparent 1px); background-size:20px 1px; background-repeat:repeat-x; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1rem; }
  .card { padding:1rem 1.1rem; transition:border-color 200ms; }
  .card:hover { border-color:color-mix(in srgb, var(--primary) 55%, transparent); }
  .card.offline { opacity:.55; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name .pic { cursor:pointer; }
  .name { font-size:1rem; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .swatch { width:.7rem; height:.7rem; border-radius:3px; background:var(--c); flex:none; }
  .meta { font:.65rem/1.5 var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--muted-foreground); }
  .air { margin:.75rem 0; padding-left:1rem; border-left:2px solid var(--c); }
  .air b { display:block; font:500 1.9rem/1.1 var(--mono); letter-spacing:-0.025em; font-variant-numeric:tabular-nums; color:var(--foreground); }
  .air small { display:block; margin-top:.3rem; font:.65rem/1 var(--mono); text-transform:uppercase; letter-spacing:.16em; color:var(--muted-foreground); }
  .flying { font:500 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; padding:3px 7px; border-radius:4px; border:1px solid var(--c); color:#fff; background:var(--c); }
  .bottom { display:flex; flex-direction:column; align-items:flex-start; gap:.6rem; }
  .bottom button { height:2rem; padding:0 .6rem; font-size:.65rem; }
  .actions { display:flex; gap:.35rem; flex:none; }
  #empty { color:var(--muted-foreground); font-size:.9rem; margin:0 0 1rem; }
  dialog#rename { width:min(26rem, calc(100vw - 2rem)); padding:1.5rem; background:var(--card); color:var(--foreground); }
  dialog#rename::backdrop { background:rgba(16, 20, 17, 0.35); backdrop-filter:blur(3px); }
  dialog#rename h2 { font:600 1.25rem/1.2 var(--display); letter-spacing:-0.02em; margin:0 0 1rem; }
  dialog#rename label { display:block; margin-bottom:.5rem; }
  dialog#rename input { width:100%; height:2.75rem; padding:0 .8rem; font:500 1.1rem var(--sans); color:var(--foreground); background:var(--card); border:1px solid var(--input); border-radius:calc(var(--radius) - 2px); }
  dialog#rename input:focus { outline:2px solid var(--primary); outline-offset:1px; }
  dialog#rename .hint { margin:.6rem 0 1.25rem; font-size:.8rem; color:var(--muted-foreground); }
  dialog#rename .row { display:flex; justify-content:flex-end; gap:.5rem; }
  button.primary { color:#fff; background:var(--primary); border-color:var(--primary); }
  button.primary:hover:not(:disabled) { background:color-mix(in srgb, var(--primary) 85%, black); border-color:var(--primary); }
  /* Race finish (space bar): countdown, winner, podium, confetti and fireworks over the leaderboard. */
  #finale { position:fixed; inset:4.5rem 0 0 0; z-index:20; overflow:hidden; display:grid; place-items:center; pointer-events:none;
    font-family:"Press Start 2P", "Courier New", ui-monospace, monospace; color:#fff; text-align:center; }
  #finale[hidden] { display:none; }
  #finale .shade { position:absolute; inset:0; background:rgba(13, 17, 23, 0.55); backdrop-filter:blur(2px); transition:background 600ms; }
  #finale.won .shade { background:radial-gradient(circle at 50% 40%, #1b1f4a 0%, #0d1117 75%); }
  #finale canvas { position:absolute; inset:0; width:100%; height:100%; }
  #finale .stage { position:relative; display:flex; flex-direction:column; align-items:center; gap:2vh; padding:2vh 1rem; }
  .gametext { text-transform:uppercase; letter-spacing:.04em; line-height:1.15; -webkit-text-stroke:2px #0d1117; paint-order:stroke fill;
    text-shadow:4px 4px 0 #8534f3, 8px 8px 0 #0d1117; }
  #countdown .title { font-size:clamp(1.4rem, 5vw, 4rem); color:#5fed83; animation:slidein 700ms cubic-bezier(.2, 1.6, .4, 1) both; }
  #countdown .num { font-size:clamp(6rem, 26vh, 16rem); color:#ffd33d; margin-top:2vh; text-shadow:6px 6px 0 #f0313e, 12px 12px 0 #0d1117; }
  #countdown .num.tick { animation:pop 1s ease-out both; }
  #countdown .num.hurry { color:#ff7b72; }
  #winner .title { font-size:clamp(1.8rem, 7vw, 5.5rem); color:#ffd33d; animation:zoomin 900ms cubic-bezier(.2, 1.7, .4, 1) both; }
  #winner .title.wiggle { animation:zoomin 900ms cubic-bezier(.2, 1.7, .4, 1) both, wiggle 1.6s 1s ease-in-out infinite; }
  #podium { display:flex; align-items:flex-end; justify-content:center; gap:clamp(.5rem, 2vw, 2rem); margin-top:3vh; }
  .place { width:clamp(7rem, 18vw, 15rem); display:flex; flex-direction:column; align-items:center; animation:rise 800ms cubic-bezier(.2, 1.4, .4, 1) both; }
  .place img, .place .noicon { width:clamp(3.5rem, 9vw, 7rem); height:clamp(3.5rem, 9vw, 7rem); object-fit:contain; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); animation:bounce 1.4s ease-in-out infinite; }
  .place .noicon { border-radius:50%; background:var(--c); }
  .place .who { margin:.6rem 0 .3rem; font-size:clamp(.6rem, 1.3vw, 1.1rem); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .place .time { font-size:clamp(.5rem, 1vw, .85rem); color:#c9d1d9; margin-bottom:.6rem; }
  .place .block { width:100%; display:grid; place-items:center; border-radius:.5rem .5rem 0 0; background:var(--c);
    box-shadow:inset 0 -10px 0 rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.25); font-size:clamp(1.5rem, 4vw, 3.5rem); color:#fff; }
  .place.p1 .block { height:clamp(8rem, 30vh, 18rem); }
  .place.p2 .block { height:clamp(5.5rem, 21vh, 13rem); }
  .place.p3 .block { height:clamp(4rem, 15vh, 9rem); }
  .place.p1 { animation-delay:900ms; } .place.p2 { animation-delay:600ms; } .place.p3 { animation-delay:300ms; }
  .place.empty { visibility:hidden; }
  #finale .hint { margin-top:2vh; font:500 .7rem/1 var(--mono); letter-spacing:.14em; color:#8b949e; text-transform:uppercase; }
  @keyframes slidein { from { transform:translateY(-60vh) scale(.6); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes pop { 0% { transform:scale(2.6); opacity:0; } 18% { transform:scale(.92); opacity:1; } 30% { transform:scale(1.05); } 45%, 80% { transform:scale(1); opacity:1; } 100% { transform:scale(.7); opacity:.2; } }
  @keyframes zoomin { from { transform:scale(0) rotate(-12deg); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes wiggle { 0%, 100% { transform:rotate(0) scale(1); } 25% { transform:rotate(-3deg) scale(1.04); } 75% { transform:rotate(3deg) scale(1.04); } }
  @keyframes rise { from { transform:translateY(80vh); } to { transform:none; } }
  @keyframes bounce { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) { #finale * { animation-duration:1ms !important; animation-iteration-count:1 !important; } }
  /* Landscape desktops (16:9 and similar): the chart fills the window below the header, so every bar is above the fold. */
  @media (min-aspect-ratio: 4/3) and (min-width: 1024px) {
    main { max-width:none; padding:1rem 1.5rem 1.5rem; }
    #chartwrap { height:calc(100vh - 4.5rem - 2rem); height:calc(100dvh - 4.5rem - 2rem); }
  }
</style>
</head>
<body>
<header>
  <h1><span class="mark" aria-hidden="true"><img id="logo" alt="" width="22" height="22"></span>Air time</h1>
  <span id="conn">connecting…</span>
  <button id="sound" class="icon" aria-pressed="false"></button>
  <!-- Icons: Material Design Icons autorenew, volume-off, volume-high (Apache-2.0, pictogrammers.com). -->
  <button id="resetall" class="danger icon" title="Reset all" aria-label="Reset all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,6V9L16,5L12,1V4A8,8 0 0,0 4,12C4,13.57 4.46,15.03 5.24,16.26L6.7,14.8C6.25,13.97 6,13 6,12A6,6 0 0,1 12,6M18.76,7.74L17.3,9.2C17.74,10.04 18,11 18,12A6,6 0 0,1 12,18V15L8,19L12,23V20A8,8 0 0,0 20,12C20,10.43 19.54,8.97 18.76,7.74Z"/></svg></button>
</header>
<main>
  <div id="chartwrap" class="surface"><canvas id="chart"></canvas></div>
  <div class="dots"></div>
  <p id="empty">Looking for badges… They need the Wi-Fi Race app on the same network as this computer.</p>
  <div id="grid"></div>
</main>
<div id="finale" hidden aria-live="assertive">
  <div class="shade"></div>
  <canvas id="fireworks"></canvas>
  <div class="stage">
    <div id="countdown"><div class="title gametext">Race ending in..</div><div class="num gametext"></div></div>
    <div id="winner" hidden>
      <div class="title gametext"></div>
      <div id="podium"></div>
      <div class="hint">Reset all to play again</div>
    </div>
  </div>
  <canvas id="confetti"></canvas>
</div>
<dialog id="rename" class="surface">
  <form method="dialog">
    <h2>Rename <span id="rename-old"></span></h2>
    <label for="rename-name" class="eyebrow">New name · up to 16 characters</label>
    <input id="rename-name" maxlength="16" autocomplete="off" spellcheck="false" required>
    <p class="hint">Names containing a plushie (Duck, Mona, Copilot…) get its picture and sounds.</p>
    <div class="row"><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save</button></div>
  </form>
</dialog>
<script>
const LIVE_MAX_MS = 3000; // longest a flight is extended past the last report
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const colourOf = {};     // badge_id -> its colour, picked by the server so no two badges share one
let badges = [], ws;

// GitHub Octocat (Mona): Primer Octicons mark-github-24 (MIT, github.com/primer/octicons).
const OCTOCAT_LOGO = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#101411"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>`;
const css = getComputedStyle(document.documentElement);
const SANS = css.getPropertyValue("--sans"), MONO = css.getPropertyValue("--mono");
const INK = {text: "#101411", muted: css.getPropertyValue("--muted-foreground"), grid: "rgba(16, 20, 17, 0.09)"};
$("logo").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(OCTOCAT_LOGO.replace('fill="#101411"', 'fill="#5FED83"'));
// Each badge keeps one colour everywhere, matching its own screen.
const colour = id => colourOf[id] || "#909692";

// Plushie pictures and sounds live in web/plushies/<name>/ (icon, throw, drop).
// A badge uses the folder whose name is in its own (the longest match wins), and
// "default" for anything that folder lacks. See web/plushies/README.md.
let plushies = {};       // folder -> {icon, throw, drop} URLs, from the server
const icons = {};        // url -> Image
function plushie(name) {
  const n = String(name).toLowerCase();
  let best = "";
  for (const k in plushies) if (k !== "default" && k.length > best.length && n.includes(k)) best = k;
  return best;
}
// {url, own}: own is false when the file comes from "default".
function asset(name, kind) {
  const own = (plushies[plushie(name)] || {})[kind];
  return own ? {url: own, own: true} : {url: (plushies.default || {})[kind], own: false};
}
function icon(name) {
  const {url} = asset(name, "icon");
  if (!url) return null;
  if (!icons[url]) { icons[url] = new Image(); icons[url].src = url; }
  return icons[url];
}
const badgeIcon = name => {
  const i = icon(name);
  return i ? `<img src="${esc(i.src)}" alt="" style="height:1.2em;vertical-align:-0.25em;margin-right:4px">` : "";
};
fetch("/plushies/manifest.json").then(r => r.json()).then(m => {
  plushies = m;
  if (audio) preload();
  if (badges.length) render({badges});
}).catch(() => {});

function fmt(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = Math.floor(s % 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${m}:${String(r).padStart(2, "0")}`;
}

// While a badge last reported being in the air, its air time keeps rising in
// real time until the next report replaces the estimate. Once a race ends, the
// counters hold the values they had at the whistle until Reset all.
let frozen = null;       // badge_id -> air ms at the end of the race
const extra = (b, now) => !frozen && b && b.online && b.state === "throw" && b.totals ? Math.min(Math.max(0, now - b.seen), LIVE_MAX_MS) : 0;
const liveAir = (b, now) => frozen ? frozen[b.badge_id] || 0 : b.totals.throw + extra(b, now);

// One card element per badge, built once and then updated in place, so its
// buttons keep their hover state and clicks while statuses stream in.
const cards = {};        // badge_id -> element
const setText = (el, v) => { if (el.textContent !== v) el.textContent = v; };
const setHTML = (el, v) => { if (el.dataset.html !== v) { el.dataset.html = v; el.innerHTML = v; } };
function makeCard(id) {
  const el = document.createElement("div");
  el.innerHTML = `<div class="top"><span class="name"><span class="swatch"></span><span class="pic" data-sound="${id}"></span><span class="nm"></span><span class="flying" hidden>In the air</span></span>
      <span class="meta">${id}</span></div>
    <div class="air"><b data-air="${id}"></b><small>air time</small></div>
    <div class="bottom"><span class="meta since"></span>
      <span class="actions"><button data-identify="${id}" title="Flash the badge's screen">Find</button><button data-rename="${id}" title="Rename the badge">Rename</button><button data-id="${id}">Reset</button></span></div>`;
  return el;
}
function card(b) {
  const el = cards[b.badge_id] = cards[b.badge_id] || makeCard(b.badge_id);
  const air = b.totals ? fmt(liveAir(b, Date.now())) : "–";
  const since = !b.totals ? "no totals yet"
    : b.reset && b.lifetime ? `since page reset · lifetime ${fmt(b.lifetime.throw + extra(b, Date.now()))}` : "lifetime";
  const seen = b.online ? `${b.rssi} dBm` : `offline · ${Math.round(b.age)} s ago`;
  const cls = "card surface" + (b.online ? "" : " offline");
  if (el.className !== cls) el.className = cls;
  if (el.style.getPropertyValue("--c") !== colour(b.badge_id)) el.style.setProperty("--c", colour(b.badge_id));
  const pic = el.querySelector(".pic");
  setHTML(pic, badgeIcon(b.name));
  pic.title = `Play ${b.name}'s sound (Shift-click: its drop sound)`;
  setText(el.querySelector(".nm"), b.name);
  el.querySelector(".flying").hidden = !(b.online && b.state === "throw");
  setText(el.querySelector("[data-air]"), air);
  setText(el.querySelector(".since"), `${since} · ${seen}`);
  el.querySelector("[data-identify]").disabled = !b.online;
  el.querySelector("[data-rename]").disabled = !b.online;
  el.querySelector("[data-id]").disabled = !b.totals;
  return el;
}

// Sounds of delight, played by this computer while a plushie is in the air.
// Every file is fetched and decoded once, when sound is first turned on, so a
// throw or drop starts its sound straight away from memory.
let audio, master;
let soundOn = false;  // muted on every load; one click toggles
const buffers = {};      // url -> decoded AudioBuffer
const loading = {};      // url -> promise of it
function ctx() {
  if (!audio) {

  if (r) openRename(r.dataset.rename);

  if (p) { const badge = badges.find(x => x.badge_id === p.dataset.sound); if (badge) playSoon(badge, e.shiftKey ? "drop" : "throw"); showSound(); }
};
$("sound").onclick = () => {
  soundOn = !soundOn;
  if (soundOn) playSoon({name: "", badge_id: "0"}, "throw");
  showSound();
};
// Browsers start audio suspended until the page is clicked.
document.addEventListener("pointerdown", () => { if (soundOn) ctx(); });
showSound();
$("resetall").onclick = () => { resetRace(); send({op: "reset_all"}); };
// Rename dialog.
const dlg = $("rename");
function openRename(id) {
  const b = badges.find(x => x.badge_id === id);
  if (!b) return;
  dlg.dataset.id = id;
  setText($("rename-old"), b.name);
  $("rename-name").value = b.name;
  dlg.showModal();
  $("rename-name").select();
}
dlg.onclose = () => {
  const id = dlg.dataset.id, old = (badges.find(x => x.badge_id === id) || {}).name;
  const name = $("rename-name").value.trim().slice(0, 16);
  if (dlg.returnValue === "save" && name && name !== old) send({op: "rename", badge_id: id, name});
  dlg.returnValue = "";
};
dlg.onclick = e => { if (e.target === dlg) dlg.close(); };  // click the backdrop to cancel
connect();
requestAnimationFrame(draw);
</script>
</body>
</html>

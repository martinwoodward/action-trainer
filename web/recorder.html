<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Action Trainer · Badger</title>
<link rel="icon" href="https://badger.github.io/favicon.svg">
<script>
  (() => { const t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    if (t === "light") document.documentElement.classList.add("light"); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..800&display=swap">
<style>
  /* Theme tokens from badger.github.io. */
  :root {
    --bg:#050506; --panel:#111312; --inset:#0a0c0b; --control:#131614; --control-hover:#1a1e1b;
    --line:#353b37; --text:#f5f5f5; --dim:#98a39b; --accent:#5fed83; --accent-hover:#7ff19b; --accent-fg:#050506;
    --accent-soft:rgba(95,237,131,.5); --accent-glow:rgba(95,237,131,.6);
    --rec:#e9465a; --danger-bg:rgba(233,70,90,.12); --danger-bg-hover:rgba(233,70,90,.2); --danger-fg:#ff8a98;
    --header-bg:rgba(5,5,6,.9); --header-line:rgba(53,59,55,.8);
    --page-glow:rgba(95,237,131,.07); --page-sheen:rgba(255,255,255,.015); --grid-dot:rgba(95,237,131,.24);
    --shadow:0 14px 40px rgba(0,0,0,.18);
    --plot-grid:#252a27; --plot-sel:rgba(95,237,131,.14); --plot-band:.12;
    --radius:.7rem;
    --sans:"Mona Sans", system-ui, sans-serif; --mono:"Monaspace Neon", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme:dark;
  }
  :root.light {
    --bg:#f2f5f3; --panel:#ffffff; --inset:#fafcfb; --control:#ffffff; --control-hover:#ebefec;
    --line:#cdd5d0; --text:#101411; --dim:#585f5a; --accent:#067a27; --accent-hover:#05651f; --accent-fg:#ffffff;
    --accent-soft:rgba(6,122,39,.45); --accent-glow:rgba(6,122,39,.35);
    --rec:#ce222d; --danger-bg:#fdf2f3; --danger-bg-hover:#fbe4e6; --danger-fg:#ce222d;
    --header-bg:rgba(242,245,243,.88); --header-line:#cdd5d0;
    --page-glow:rgba(15,191,62,.09); --page-sheen:rgba(255,255,255,.7); --grid-dot:rgba(8,135,43,.2);
    --shadow:0 1px 2px rgba(16,20,17,.04), 0 10px 30px rgba(16,20,17,.06);
    --plot-grid:#e1e7e3; --plot-sel:rgba(6,122,39,.1); --plot-band:.16;
    color-scheme:light;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 var(--sans); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 78% 0%, var(--page-glow), transparent 26rem), linear-gradient(180deg, var(--page-sheen), transparent 26rem);
    background-attachment:fixed; min-height:100vh; }
  body::before { content:""; position:fixed; inset:0 0 auto 0; height:420px; pointer-events:none; z-index:-1;
    background-image:radial-gradient(circle, var(--grid-dot) 1px, transparent 1px); background-size:22px 22px;
    -webkit-mask-image:linear-gradient(180deg, black, transparent 82%); mask-image:linear-gradient(180deg, black, transparent 82%); }
  header { position:sticky; top:0; z-index:5; height:4.5rem; padding:0 24px; border-bottom:1px solid var(--header-line);
    background:var(--header-bg); backdrop-filter:blur(24px); display:flex; gap:12px; align-items:center; }
  header img { width:36px; height:36px; }
  header h1 { font-size:24px; font-weight:600; letter-spacing:-.02em; margin:0; font-stretch:87.5%; }
  #conn { margin-left:auto; font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--dim); }
  #conn:empty + * { margin-left:auto; }
  .icon { padding:0; width:36px; height:36px; display:grid; place-items:center; color:var(--dim); position:relative; }
  .icon svg { width:18px; height:18px; }
  #logbtn.alert::after { content:""; position:absolute; top:7px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--rec); }
  .pop { position:absolute; z-index:10; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:0 18px 50px rgba(0,0,0,.28); padding:14px; }
  #logpop { position:fixed; top:4.9rem; right:24px; width:min(460px, calc(100vw - 48px)); }
  #theme .sun, :root.light #theme .moon { display:none; }
  :root.light #theme .sun { display:block; }
  main { display:grid; grid-template-columns: minmax(0, 1fr) 320px; gap:20px; padding:24px; max-width:1400px; margin:0 auto; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:20px;
    box-shadow:var(--shadow); }
  h2 { font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--dim); margin:0 0 14px; }
  button { font:500 14px/1.2 var(--sans); color:var(--text); background:var(--control); border:1px solid var(--line);
    border-radius:calc(var(--radius) - 2px); padding:8px 14px; cursor:pointer; transition:border-color .15s, background .15s, color .15s; }
  button:hover:not(:disabled) { border-color:var(--accent-soft); background:var(--control-hover); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:600; }
  button.primary:hover:not(:disabled) { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.danger { background:var(--danger-bg); border-color:var(--rec); color:var(--danger-fg); }
  button.danger:hover:not(:disabled) { background:var(--danger-bg-hover); border-color:var(--rec); }
  input[type=text], input[type=number] { font:inherit; color:var(--text); background:var(--inset); border:1px solid var(--line);
    border-radius:calc(var(--radius) - 2px); padding:7px 10px; }
  input:focus { outline:none; border-color:var(--accent); }
  .badge { display:flex; justify-content:space-between; align-items:center; padding:8px 0; gap:8px; }
  .badge small, .sub { color:var(--dim); font:12px/1.4 var(--mono); }
  .badge.me { padding-top:0; }
  #badges .row + .badge { border-top:1px solid var(--line); margin-top:8px; padding-top:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .dot.on { background:var(--accent); box-shadow:0 0 10px var(--accent-glow); }
  .dot.wait { background:#f2cc60; animation:pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity:.3; } }
  .who { display:flex; gap:10px; align-items:center; min-width:0; }
  .name { background:none; border:0; padding:2px 4px; margin-left:-4px; font-weight:600; font-size:16px; display:inline-flex; gap:6px; align-items:center; }
  .name svg { width:13px; height:13px; color:var(--dim); opacity:0; transition:opacity .15s; }
  .name:hover svg, .name:focus-visible svg { opacity:1; }
  .name:hover:not(:disabled) { background:var(--control-hover); }
  button.small { padding:5px 10px; font-size:13px; }
  .ghost { background:none; }
  [hidden] { display:none !important; }
  #renamepop { width:260px; display:flex; gap:8px; }
  #renamepop input { flex:1; min-width:0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  #overall { display:flex; align-items:baseline; gap:10px; }
  #overall b { font-size:40px; font-weight:700; letter-spacing:-.03em; font-stretch:87.5%; font-variant-numeric:tabular-nums; }
  .delta { font:600 13px var(--mono); }
  .delta.up { color:var(--accent); } .delta.down { color:var(--danger-fg); }
  .bars { display:grid; gap:10px; margin:14px 0 16px; }
  .bar { display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:13px; }
  .bar span:nth-child(2) { font:600 13px var(--mono); font-variant-numeric:tabular-nums; }
  .bar .track { grid-column:1 / -1; height:6px; border-radius:3px; background:var(--inset); border:1px solid var(--line); overflow:hidden; }
  .bar .track i { display:block; height:100%; border-radius:3px; }
  #kept { background:var(--danger-bg); border-radius:calc(var(--radius) - 2px); padding:10px 12px; font-size:13px; margin-bottom:12px; }
  #kept button { margin-top:8px; }
  .wide { width:100%; padding:11px 14px; }
  .promptrow { display:flex; gap:16px; align-items:flex-start; justify-content:space-between; }
  #guides { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:20px; }
  .tile { text-align:left; padding:16px 18px; display:grid; gap:4px; }
  .tile b { font-size:18px; display:flex; align-items:center; gap:10px; }
  .tile b i { width:12px; height:12px; border-radius:4px; }
  .tile span { color:var(--dim); font-size:13px; }
  #phasebar { height:8px; background:var(--inset); border-radius:4px; margin:18px 0 4px; overflow:hidden; }
  #phasebar i { display:block; height:100%; width:0; background:var(--accent); box-shadow:0 0 12px var(--accent-glow); }
  #big { font-size:56px; line-height:1.1; font-weight:700; letter-spacing:-.03em; font-stretch:87.5%; font-variant-numeric:tabular-nums; }
  #bigsub { color:var(--dim); font-size:16px; margin-top:4px; }
  #plot { height:340px; }
  canvas { width:100%; height:260px; background:var(--inset); border:1px solid var(--line); border-radius:calc(var(--radius) - 2px); display:block; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font:11px/1 var(--mono); color:var(--dim); margin-top:10px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  #pending table { border-collapse:collapse; margin-bottom:10px; font-family:var(--mono); font-size:13px; }
  #pending td { padding:3px 14px 3px 0; }
  #log { color:var(--dim); font:12px/1.6 var(--mono); max-height:50vh; overflow:auto; }
  .err { color:var(--rec); }
  .state { font-weight:600; color:var(--accent); }
  .hint { color:var(--dim); font-size:13px; margin:0 0 10px; }
  #annolabels button { text-transform:capitalize; }
  #annolabels button i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  #annolabels kbd { color:var(--dim); font:11px var(--mono); margin-left:6px; }
  #segs { font-size:13px; margin-top:10px; }
  #segs div { display:flex; gap:10px; align-items:center; padding:3px 0; font-family:var(--mono); }
  #segs i { display:inline-block; width:10px; height:10px; border-radius:3px; }
  #segs button { padding:2px 8px; font-size:12px; }
</style>
</head>
<body>
<header><img src="https://badger.github.io/favicon.svg" alt=""><h1>Action Trainer</h1><span id="conn">connecting to backend…</span><button id="logbtn" class="icon ghost" title="Log" aria-label="Log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button><button id="theme" class="icon ghost" title="Toggle light/dark" aria-label="Toggle light/dark"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></header>
<div id="logpop" class="pop" hidden><h2>Log</h2><div id="log"></div></div>
<div id="renamepop" class="pop" hidden><input id="newname" type="text" maxlength="16" placeholder="Badge name"><button id="rename" class="primary">Save</button></div>
<main>
  <div>
    <section>
      <div class="promptrow">
        <div><div id="big">—</div><div id="bigsub">Connect a badge to start.</div></div>
        <div class="row" style="margin:6px 0 0;flex-wrap:nowrap">
          <button id="startstop" class="small ghost" disabled>Free record</button>
          <button id="cancel" class="danger" hidden>Cancel</button>
        </div>
      </div>
      <div id="phasebar" hidden><i></i></div>
      <div id="guides"></div>
      <div style="margin-top:20px"><canvas id="plot"></canvas></div>
      <div class="legend" id="legend"></div>
    </section>
    <section id="pending" hidden>
      <h2>Review recording</h2>
      <table id="summary"></table>
      <p class="hint" id="annohint"></p>
      <canvas id="review" style="height:220px;cursor:crosshair"></canvas>
      <div class="row" id="annolabels"></div>
      <div id="segs"></div>
      <div class="row"><button id="save" class="primary">Save</button><button id="discard">Discard</button></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Badge</h2>
      <div id="badges"><span class="sub">Scanning for badges…</span></div>
    </section>
    <section>
      <h2>Model on badge</h2>
      <div id="score"></div>
      <div id="kept" hidden></div>
      <button id="traindeploy" class="primary wide" disabled>Train &amp; deploy</button>
      <div id="modelstatus" class="sub" style="margin-top:8px;text-align:center"></div>
    </section>
  </div>
</main>
<script>
let theme = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  theme = {grid: v("--plot-grid"), dim: v("--dim"), text: v("--text"), accent: v("--accent"), inset: v("--inset"), sel: v("--plot-sel"), band: +v("--plot-band") || 0.12};
}
readTheme();
function setTheme(light) {
  document.documentElement.classList.toggle("light", light);
  readTheme();
  if (typeof renderReview === "function") renderReview();
}
document.getElementById("theme").onclick = () => {
  const light = !document.documentElement.classList.contains("light");
  localStorage.setItem("theme", light ? "light" : "dark");
  setTheme(light);
};
matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => { if (!localStorage.getItem("theme")) setTheme(e.matches); });
const STATE_COLOURS = ["#58a6ff", "#5fed83", "#f2cc60", "#f0883e", "#e9465a", "#4a524c"];
const STATE_NAMES = ["Still", "Walk", "Flying", "Throw", "Drop", "Handling"];
const WINDOW_MS = 10000;

let ws, status = null, samples = [];
const $ = id => document.getElementById(id);
const send = msg => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const log = (text, cls) => {
  const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString() + "  " + text;
  if (cls) d.className = cls;
  $("log").prepend(d);
  if (cls === "err" && $("logpop").hidden) $("logbtn").classList.add("alert");
};
function togglePop(pop, anchor) {
  const open = pop.hidden;
  for (const p of document.querySelectorAll(".pop")) p.hidden = true;
  if (!open) return false;
  pop.hidden = false;
  if (anchor) {
    const r = anchor.getBoundingClientRect();
    pop.style.left = Math.min(r.left + scrollX, innerWidth - pop.offsetWidth - 16) + "px";
    pop.style.top = r.bottom + scrollY + 6 + "px";
  }
  return true;
}
document.addEventListener("mousedown", e => {
  if (!e.target.closest(".pop, #logbtn, .name")) for (const p of document.querySelectorAll(".pop")) p.hidden = true;
});
$("logbtn").onclick = () => { togglePop($("logpop")); $("logbtn").classList.remove("alert"); };

$("legend").innerHTML = STATE_NAMES.map((n, i) => `<span><i style="background:${STATE_COLOURS[i]}"></i>${n}</span>`).join("") + `<span>line = |a| (g)</span>`;

const dur = s => s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${Math.round(s)}s`;

// One card: the badge you're on (click its name to rename), then any others nearby.
function renderBadges() {
  const mine = status.connected || status.connecting || status.reconnecting;
  const me = status.badges.find(b => b.address === mine);
  let html = "";
  if (mine) {
    const conn = !!status.connected;
    const what = conn ? `Connected · ${me ? me.rssi + " dBm · " : ""}lost ${status.lost}`
      : status.connecting ? "Connecting…" : "Reconnecting…";
    html += `<div class="badge me"><div class="who"><span class="dot ${conn ? "on" : "wait"}"></span><div>` +
      `<button class="name" title="${esc(conn ? "Rename · " + status.info : "")}" ${conn ? "" : "disabled"}>${esc(me ? me.name : "Badge")}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` +
      `<div class="sub">${what}</div></div></div></div>` +
      `<div class="row" style="margin-top:4px"><button class="small" data-op="identify" ${conn ? "" : "disabled"}>Identify</button>` +
      `<button class="small ghost" data-op="disconnect">Disconnect</button></div>`;
  }
  const others = status.badges.filter(b => b.address !== mine);
  html += others.map(b => {
    const where = b.age > 5 ? `not seen ${Math.round(b.age)}s` : `${b.rssi} dBm`;
    return `<div class="badge"><div class="who"><span class="dot"></span><div><b>${esc(b.name)}</b><div class="sub">${where}</div></div></div>` +
      `<button class="small" data-a="${esc(b.address)}" ${mine ? "disabled" : ""}>Connect</button></div>`;
  }).join("");
  $("badges").innerHTML = html || `<span class="sub">Scanning for badges… open the pedometer app on one.</span>`;
}
$("badges").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.a) { send({op: "connect", address: b.dataset.a}); log("connecting to " + b.dataset.a + "…"); }
  else if (b.dataset.op) send({op: b.dataset.op});
  else if (b.classList.contains("name") && togglePop($("renamepop"), b)) {
    const me = status.badges.find(x => x.address === status.connected);
    $("newname").value = me ? me.name : "";
    $("newname").select();
  }
};
function rename() {
  const n = $("newname").value.trim();
  if (n) { send({op: "rename", name: n}); log("renamed to " + n); }
  $("renamepop").hidden = true;
}
$("rename").onclick = rename;
$("newname").onkeydown = e => { if (e.key === "Enter") rename(); if (e.key === "Escape") $("renamepop").hidden = true; };

// Scorecard: how the badge's model does on recordings it never trained on.
const pct = v => Math.round(v * 100) + "%";
const SCORE_ROWS = [["walk", "Spots walking", "#5fed83"], ["not_walk", "Ignores other movement", "#58a6ff"],
  ["throw", "Throws", "#f0883e"], ["drop", "Drops", "#e9465a"]];
function delta(now, before) {
  if (before == null) return "";
  const d = Math.round((now - before) * 100);
  return d ? `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${d}</span>` : "";
}
function renderModel() {
  const m = status.model || {}, card = m.deployed, test = card && card.test;
  if (!test) {
    $("score").innerHTML = `<p class="hint">${card ? "Deployed. Record a few more runs and I'll hold some back to score it."
      : "Record a few runs, then train. I'll score it on recordings it never saw."}</p>`;
  } else {
    const prev = card.previous;
    $("score").innerHTML = `<div id="overall"><b>${pct(test.accuracy)}</b>${delta(test.accuracy, prev && prev.accuracy)}</div>` +
      `<div class="sub">right on ${test.recordings ? test.recordings.length : ""} held-back recordings</div><div class="bars">` +
      SCORE_ROWS.filter(([k]) => test.recall[k] != null).map(([k, name, colour]) =>
        `<div class="bar"><span>${name} ${delta(test.recall[k], prev && prev.recall[k])}</span><span>${pct(test.recall[k])}</span>` +
        `<div class="track"><i style="width:${pct(test.recall[k])};background:${colour}"></i></div></div>`).join("") + `</div>`;
  }
  const kept = m.kept;
  $("kept").hidden = !kept;
  if (kept) $("kept").innerHTML = `New model scored ${pct(kept.test.accuracy)}, below the ${pct(kept.current.accuracy)} on your badge, so I kept the current one.` +
    `<br><button class="small" id="force">Deploy anyway</button>`;
}
$("kept").onclick = e => { if (e.target.id === "force") trainDeploy(true); };
function trainDeploy(force) {
  $("traindeploy").disabled = true;
  $("modelstatus").textContent = "Training…";
  send({op: "train_deploy", force});
}

function render() {
  renderBadges();
  renderModel();
  const conn = !!status.connected, rec = status.recording, p = status.pending;
  const busy = !!(rec || p || guide);
  for (const b of $("guides").querySelectorAll("button[data-g]")) b.disabled = !conn || busy;
  $("guides").hidden = !!guide || !!rec;
  $("traindeploy").disabled = $("modelstatus").textContent === "Training…" || !conn;
  $("cancel").hidden = !guide;
  $("startstop").hidden = !!guide;
  $("startstop").disabled = (!conn && !rec) || (!rec && busy);
  $("startstop").textContent = rec ? "Stop" : "Free record";
  $("startstop").className = rec ? "danger" : "small ghost";
  $("phasebar").hidden = !guide;
  if (guide) {
    renderGuide();
  } else if (rec) {
    $("big").textContent = dur(rec.seconds);
    $("bigsub").textContent = `Recording · move however you like, then press Stop`;
  } else if (status.connecting || status.reconnecting) {
    $("big").textContent = "…"; $("bigsub").textContent = status.connecting ? "Connecting" : "Reconnecting to badge…";
  } else if (p) {
    $("big").textContent = "Review";
    $("bigsub").textContent = "Tag what you did below, then save.";
  } else {
    $("big").textContent = conn ? "Ready" : "—";
    $("bigsub").textContent = !conn ? "Connect a badge to start."
      : lastSaved || "Pick something to train. I'll tell you what to do and tag it for you.";
  }
  $("pending").hidden = !p;
  if (p) {
    const rows = [["Duration", p.duration_s + " s"], ["Samples", `${p.samples} @ ${p.rate_hz} Hz`],
      ["Flights detected", p.flights], ["Lost packets", p.lost_packets]];
    $("summary").innerHTML = rows.map(([k, v]) => `<tr><td style="color:var(--dim)">${k}</td><td>${esc(v)}</td></tr>`).join("");
    if (review && $("review").width !== $("review").clientWidth * (window.devicePixelRatio || 1)) renderReview();
  }
}

$("startstop").onclick = () => {
  if (status.recording) return send({op: "stop"});
  lastSaved = "";
  send({op: "start"});
  log("recording");
};

// --- Guided training: timed prompts, tagged from whichever prompt was showing. ---
// [label (null = not trained), what to say, hint, seconds, short cue for the badge screen]
const ready = (hint, secs = 3) => [null, "Get ready", hint, secs, "READY"];
// Untagged pause between actions: switching takes ~2 s and would muddy both labels.
const stop = () => [null, "Stop", "Stand still for a moment.", 2, "STOP"];
const GUIDES = {
  walk: [
    ready("Hold the badge the way you'll wear it."),
    ["still", "Stand still", "Don't move.", 5, "STILL"],
    ["walk", "Start walking", "Walk normally.", 15, "WALK"],
    stop(),
    ["unknown", "Lift it up and down", "Stand in place and raise and lower the badge.", 8, "LIFT"],
    stop(),
    ["walk", "Walk again", "Walk normally.", 15, "WALK"],
    stop(),
    ["unknown", "Fidget with it", "Turn it, tilt it, tap it. No steps.", 8, "FIDGET"],
    stop(),
    ["walk", "Walk again", "Walk normally.", 10, "WALK"],
    stop(),
    ["unknown", "Swing your arms", "Stay in place, move like you're talking.", 6, "SWAY"],
    stop(),
    ["walk", "Walk again", "Walk normally.", 8, "WALK"],
    stop(),
    ["unknown", "Wave it up and down", "Stand in place and shake it like you're faking steps.", 8, "WAVE"],
    stop(),
    ["still", "Stand still", "Don't move.", 4, "STILL"],
  ],
  throw: [ready("Hold it, ready to throw."), ...Array.from({length: 5}, () => [
    ["throw", "Throw it", "Toss it up and catch it.", 3, "THROW"],
    ["unknown", "Hold it", "Hold it in your hand.", 3, "HOLD"],
  ]).flat(), ["still", "Set it down", "Leave it still.", 4, "STILL"]],
  drop: [ready("Hold it out over something soft."), ...Array.from({length: 5}, () => [
    ["drop", "Drop it", "Let it fall onto something soft.", 3, "DROP"],
    ["unknown", "Pick it up", "Pick it up and hold it out again.", 4, "PICKUP"],
  ]).flat(), ["still", "Leave it still", "Don't touch it.", 4, "STILL"]],
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Mid-activity heckles for the demo, keyed by cue. Only phases of 6 s or more get one.
// The first line of each list always plays first; the rest are shuffled.
const QUIPS = {
  WALK: ["Is that your walk? Really? Wow.", "That's the walk of someone who just merged to main on a Friday.",
    "Very runway. Keep going.", "Okay, that's a confident walk.", "Strutting. I respect it."],
  LIFT: ["Badge curls. Feel the burn.", "Do you even lift?", "Is it heavy? It looks heavy."],
  FIDGET: ["This is not a fidget spinner.", "Nervous? You seem nervous.", "It's fine. Everything's fine."],
  SWAY: ["Big keynote energy.", "Very persuasive. Tell me more.", "You're doing the TED talk thing."],
  WAVE: ["Nice try. Those don't count as steps.", "Faking steps? Bold move.", "Shaking it won't make you fitter."],
};
const DONE_LINES = {walk: "Done. Your walk has been judged. Fondly.", throw: "Done. Nothing broke. Probably.",
  drop: "Done. The badge forgives you."};
const shuffled = list => list.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
const speak = text => {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
};
let guide = null, lastSaved = "";
const GUIDE_TILES = [["walk", "Walk", "Steps vs. just moving it"], ["throw", "Throw", "Toss it up and catch it"],
  ["drop", "Drop", "Let it fall onto something soft"]];
$("guides").innerHTML = GUIDE_TILES.map(([k, name, hint]) =>
  `<button class="tile" data-g="${k}" disabled><b><i style="background:${({walk: "#5fed83", throw: "#f0883e", drop: "#e9465a"})[k]}"></i>${name}</b>` +
  `<span>${hint} · ${dur(GUIDES[k].reduce((t, step) => t + step[3], 0))}</span></button>`).join("");

function renderGuide() {
  const [label, say, hint, secs] = guide.steps[guide.i];
  const left = Math.max(0, guide.endsAt - performance.now());
  $("big").textContent = say;
  const next = guide.steps[guide.i + 1];
  $("bigsub").textContent = `${hint} · ${Math.ceil(left / 1000)}s · next: ${next ? next[1].toLowerCase() : "done"}`;
  const bar = $("phasebar").firstElementChild;
  bar.style.width = `${100 - left / (secs * 10)}%`;
  bar.style.background = label ? ANNO_COLOURS[label] : "#4a524c";
}

async function runGuide(kind) {
  const me = guide = {kind, steps: GUIDES[kind], i: 0, endsAt: 0, seen: false};
  const quips = Object.fromEntries(Object.entries(QUIPS).map(([cue, [first, ...rest]]) => [cue, [first, ...shuffled(rest)]]));
  lastSaved = "";
  send({op: "start", notes: "guided " + kind});
  log(`guided ${kind} run`);
  for (let i = 0; i < me.steps.length; i++) {
    if (guide !== me) return;
    const [label, say, , secs, cue] = me.steps[i];
    me.i = i; me.endsAt = performance.now() + secs * 1000;
    send({op: "phase", label, cue, ms: secs * 1000});
    speak(say);
    render();
    let quipAt = secs >= 6 && quips[cue]?.length ? me.endsAt - secs * 600 : Infinity;
    while (guide === me && performance.now() < me.endsAt) {
      await sleep(100);
      if (performance.now() >= quipAt) { quipAt = Infinity; speak(quips[cue].shift()); }
      renderGuide();
    }
  }
  if (guide !== me) return;
  guide = null;
  speak(DONE_LINES[kind] || "Done. Nice.");
  send({op: "stop"});
  render();
}
function stopGuide(reason) {
  if (!guide) return;
  guide = null;
  if (window.speechSynthesis) speechSynthesis.cancel();
  log(reason, reason === "cancelled" ? "" : "err");
  render();
}
$("guides").onclick = e => { const b = e.target.closest("button[data-g]"); if (b && !b.disabled) runGuide(b.dataset.g); };
$("cancel").onclick = () => { stopGuide("cancelled"); send({op: "cancel"}); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const i = +e.key - 1;
  if (review && !$("pending").hidden && i >= 0 && i < ANNO_LABELS.length) annotate(ANNO_LABELS[i]);
  if (e.key === "Escape") { sel = null; renderReview(); }
});
$("save").onclick = () => send({op: "save", segments: segs.map(s => ({start_ms: Math.round(s.start), end_ms: Math.round(s.end), label: s.label}))});
$("discard").onclick = () => { send({op: "discard"}); log("discarded"); };
$("traindeploy").onclick = () => trainDeploy(false);

function draw() {
  const c = $("plot"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (samples.length) {
    const tEnd = samples[samples.length - 1][0], tStart = tEnd - WINDOW_MS;
    const x = t => (t - tStart) / WINDOW_MS * w, y = v => h - Math.min(v, 4) / 4 * h;
    g.globalAlpha = theme.band;
    for (let i = 0; i < samples.length - 1; i++) {
      const [t, , s] = samples[i];
      g.fillStyle = STATE_COLOURS[s] || "#333";
      g.fillRect(x(t), 0, Math.max(1, x(samples[i + 1][0]) - x(t)) + 0.5, h);
    }
    g.globalAlpha = 1;
    g.strokeStyle = theme.grid; g.fillStyle = theme.dim; g.font = "11px ui-monospace, monospace"; g.lineWidth = 1;
    for (const v of [0.3, 1, 2, 3]) { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(w, y(v)); g.stroke(); g.fillText(v + " g", 4, y(v) - 3); }
    g.strokeStyle = theme.accent; g.lineWidth = 1.5; g.beginPath();
    samples.forEach(([t, m], i) => i ? g.lineTo(x(t), y(m)) : g.moveTo(x(t), y(m)));
    g.stroke();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// --- Review annotation: drag across the chart, then tag what was happening. ---
const ANNO_LABELS = ["walk", "throw", "drop", "still", "unknown"];
const ANNO_COLOURS = {walk: "#5fed83", still: "#58a6ff", unknown: "#a371f7", throw: "#f0883e", drop: "#e9465a", ignore: "#4a524c"};
const ANNO_NAMES = {unknown: "other"};
const annoName = l => l === "unknown" ? "other" : l;
let review = null, segs = [], sel = null, dragFrom = null;

$("annolabels").innerHTML = ANNO_LABELS.map((l, i) =>
  `<button data-l="${l}" disabled><i style="background:${ANNO_COLOURS[l]}"></i>${ANNO_NAMES[l] || l}<kbd>${i + 1}</kbd></button>`).join("");
$("annolabels").onclick = e => { const b = e.target.closest("button"); if (b) annotate(b.dataset.l); };
$("segs").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { segs.splice(+b.dataset.i, 1); renderReview(); } };

function annotate(l) {
  if (!sel || sel[1] - sel[0] < 50) return;
  const [a, b] = sel;
  segs = segs.flatMap(s => s.end <= a || s.start >= b ? [s]
    : [s.start < a && {...s, end: a}, s.end > b && {...s, start: b}].filter(Boolean));
  segs.push({start: a, end: b, label: l});
  segs.sort((p, q) => p.start - q.start);
  sel = null;
  renderReview();
}

function reviewX(e) {
  const r = $("review").getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * review.duration_ms;
}
$("review").onmousedown = e => { if (review) { dragFrom = reviewX(e); sel = null; renderReview(); } };
window.addEventListener("mousemove", e => { if (dragFrom !== null) { const t = reviewX(e); sel = [Math.min(dragFrom, t), Math.max(dragFrom, t)]; renderReview(); } });
window.addEventListener("mouseup", () => { dragFrom = null; });

const fmt = ms => (ms / 1000).toFixed(1) + " s";

function renderReview() {
  if (!review) return;
  $("annohint").textContent = "Drag across the chart to select a stretch, then tag it (or press 1–5). Use other for lifting or handling. Only tagged time is trained.";
  for (const b of $("annolabels").querySelectorAll("button")) b.disabled = !sel;
  $("save").disabled = !segs.length;
  $("save").title = segs.length ? "" : "Tag at least one stretch first";
  $("segs").innerHTML = segs.map((s, i) =>
    `<div><i style="background:${ANNO_COLOURS[s.label]}"></i><span style="text-transform:capitalize;min-width:80px">${annoName(s.label)}</span>` +
    `<span style="color:var(--dim)">${fmt(s.start)} – ${fmt(s.end)}</span><button data-i="${i}">Remove</button></div>`).join("");

  const c = $("review"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const d = review.data, span = review.duration_ms || 1;
  const x = t => t / span * w, y = v => h - Math.min(v, 4) / 4 * h;
  g.fillStyle = theme.inset; g.fillRect(0, 0, w, h);
  for (const s of segs) {
    g.globalAlpha = 0.28; g.fillStyle = ANNO_COLOURS[s.label];
    g.fillRect(x(s.start), 0, x(s.end) - x(s.start), h);
    g.globalAlpha = 1; g.fillRect(x(s.start), 0, x(s.end) - x(s.start), 4);
    g.fillStyle = theme.text; g.font = "11px ui-monospace, monospace";
    if (x(s.end) - x(s.start) > 30) g.fillText(annoName(s.label), x(s.start) + 4, 16);
  }
  g.strokeStyle = theme.grid; g.fillStyle = theme.dim; g.font = "11px ui-monospace, monospace"; g.lineWidth = 1;
  for (const v of [1, 2, 3]) { g.beginPath(); g.moveTo(0, y(v)); g.lineTo(w, y(v)); g.stroke(); g.fillText(v + " g", 4, y(v) - 3); }
  const step = span > 120000 ? 10000 : span > 30000 ? 5000 : 1000;
  for (let t = step; t < span; t += step) g.fillText(t / 1000 + "s", x(t) + 2, h - 4);
  g.strokeStyle = theme.accent; g.lineWidth = 1.2; g.beginPath();
  d.forEach(([t, m], i) => i ? g.lineTo(x(t), y(m)) : g.moveTo(x(t), y(m)));
  g.stroke();
  if (sel) {
    g.fillStyle = theme.sel; g.fillRect(x(sel[0]), 0, x(sel[1]) - x(sel[0]), h);
    g.strokeStyle = theme.accent; g.strokeRect(x(sel[0]) + 0.5, 0.5, x(sel[1]) - x(sel[0]), h - 1);
    g.fillStyle = theme.text; g.fillText(`${fmt(sel[0])} – ${fmt(sel[1])}`, x(sel[0]) + 4, 30);
  }
}
window.addEventListener("resize", renderReview);

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("conn").textContent = ""; };
  ws.onclose = () => { $("conn").textContent = "backend disconnected, retrying…"; setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "status") {
      const was = status && status.connected;
      status = m;
      if (guide && m.recording) guide.seen = true;
      if (guide && guide.seen && !m.recording) stopGuide("lost the badge, run stopped");
      render();
      if (was && !m.connected) log("badge disconnected", "err");
      if (!was && m.connected) log("connected: " + m.info);
    } else if (m.type === "samples") {
      samples.push(...m.data);
      const cut = samples[samples.length - 1][0] - WINDOW_MS - 500;
      while (samples.length && samples[0][0] < cut) samples.shift();
    } else if (m.type === "review") {
      review = m; sel = null;
      segs = (m.segments || []).map(s => ({start: s.start_ms, end: s.end_ms, label: s.label}));
      requestAnimationFrame(renderReview);
    } else if (m.type === "saved") {
      if (m.tagged) {
        lastSaved = "Saved " + Object.entries(m.tagged).map(([k, v]) => `${annoName(k)} ${Math.round(v)}s`).join(" · ") +
          ". Run another, or Train & deploy.";
        log(lastSaved);
      } else {
        log(m.path ? "saved " + m.path + (segs.length ? ` (${segs.length} tagged)` : "") : "nothing to save");
      }
      review = null; segs = []; sel = null;
    } else if (m.type === "training") {
      $("modelstatus").textContent = "Training…";
    } else if (m.type === "trained") {
      status.model = m.model;
      $("modelstatus").textContent = m.deployed ? "Deployed just now" : "";
      log(m.deployed ? `model ${m.deployed} deployed` : "new model scored lower, kept the current one");
      render();
    } else if (m.type === "error") {
      log(m.message, "err");
      if ($("modelstatus").textContent === "Training…") { $("modelstatus").textContent = "Failed: " + m.message; render(); }
    }
  };
}
connect();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Air-time dashboard</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  #conn { color:var(--dim); flex:1; }
  button, select { font:inherit; color:var(--text); background:#21262d; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--dim); }
  button:disabled { opacity:.45; cursor:default; }
  #chartwrap { margin:16px 20px 0; background:var(--panel); border:1px solid var(--line); border-radius:8px; height:min(55vh, 520px); }
  #chart { width:100%; height:100%; display:block; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; padding:16px 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:8px; padding:12px 14px; }
  .card.offline { opacity:.5; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .name { font-size:17px; font-weight:700; }
  .meta { color:var(--dim); font-size:12px; }
  .air { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--c); margin:4px 0; }
  .air small { font-size:13px; font-weight:400; color:var(--dim); margin-left:6px; }
  .flying { color:var(--text); background:var(--c); border-radius:999px; padding:1px 8px; font-size:12px; font-weight:700; margin-left:6px; }
  .bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #empty { color:var(--dim); padding:0 20px; }
</style>
</head>
<body>
<header>
  <h1>Air time</h1>
  <span id="conn">connecting…</span>
  <label class="meta">window
    <select id="span">
      <option value="60">1 min</option>
      <option value="300" selected>5 min</option>
      <option value="900">15 min</option>
      <option value="3600">1 h</option>
    </select>
  </label>
  <button id="resetall">Reset all</button>
</header>
<div id="chartwrap"><canvas id="chart"></canvas></div>
<p id="empty">Looking for badges… They need the Airtime app and must not be connected to the recorder.</p>
<div id="grid"></div>
<script>
const PALETTE = ["#f07814", "#2f81f7", "#3fb950", "#d2a8ff", "#f85149", "#e3b341", "#39c5cf", "#ff7b72", "#a5d6ff", "#7ee787"];
const KEEP_S = 3600;
const GAP_MS = 20000;    // matches the server's OFFLINE_S
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const colours = {};      // badge_id -> colour, stable for the session
const history = {};      // badge_id -> [[time_ms, air_ms], ...]
let badges = [], ws, clearedMs = 0;

// A badge named after an animal gets its picture at the head of its chart line:
// an emoji, or an image (an object with an Image) where no emoji fits.
const RUBBER_DUCK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <path d="M6 38c0-6 5-9 12-9h14c4 0 6-2 6-5h2c10 0 18 6 18 15 0 10-9 17-26 17H22C12 56 6 49 6 38z" fill="#ffd21f" stroke="#c99400" stroke-width="2"/> <path d="M24 38c4-3 12-3 16 1-2 6-12 8-18 4z" fill="#ffbf00" stroke="#c99400" stroke-width="1.5"/> <circle cx="44" cy="20" r="12" fill="#ffd21f" stroke="#c99400" stroke-width="2"/> <path d="M54 19c5-1 9 1 9 3s-4 4-9 3z" fill="#ff7a00" stroke="#c45500" stroke-width="1.5"/> <circle cx="47" cy="16" r="2.6" fill="#1b1b1b"/> <circle cx="47.9" cy="15.2" r="0.9" fill="#fff"/> </svg>`;
// GitHub Copilot mark: Primer Octicons copilot-24 (MIT, github.com/primer/octicons).
const COPILOT = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#e6edf3"><path d="M23.922 16.992c-.861 1.495-5.859 5.023-11.922 5.023-6.063 0-11.061-3.528-11.922-5.023A.641.641 0 0 1 0 16.736v-2.869a.841.841 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.195 10.195 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952 1.399-1.136 3.392-2.093 6.122-2.093 2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.832.832 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256ZM12.172 11h-.344a4.323 4.323 0 0 1-.355.508C10.703 12.455 9.555 13 7.965 13c-1.725 0-2.989-.359-3.782-1.259a2.005 2.005 0 0 1-.085-.104L4 11.741v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.323 4.323 0 0 1-.355-.508h-.016.016Zm.641-2.935c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/><path d="M14.5 14.25a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1Zm-5 0a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1Z"/></svg>`;
const image = svg => { const i = new Image(); i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); return i; };
// GitHub Octocat (Mona): Primer Octicons mark-github-24 (MIT, github.com/primer/octicons).
const OCTOCAT = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#e6edf3"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>`;

const NAMESAKES = [
  ["copilot", {img: image(COPILOT)}],
  ["mona", {img: image(OCTOCAT)}], ["octocat", {img: image(OCTOCAT)}],
  ["duck", {img: image(RUBBER_DUCK)}], ["squirrel", "🐿️"], ["bear", "🐻"], ["bunny", "🐰"], ["rabbit", "🐰"],
  ["octo", "🐙"], ["cat", "🐱"], ["dog", "🐶"], ["fox", "🦊"], ["owl", "🦉"], ["frog", "🐸"],
  ["penguin", "🐧"], ["panda", "🐼"], ["unicorn", "🦄"], ["dino", "🦖"], ["monkey", "🐵"],
  ["pig", "🐷"], ["chick", "🐥"], ["whale", "🐳"], ["turtle", "🐢"], ["hedgehog", "🦔"],
];
const namesake = name => (NAMESAKES.find(([k]) => String(name).toLowerCase().includes(k)) || [])[1];
const badgeIcon = name => {
  const n = namesake(name);
  if (!n) return "";
  return n.img ? `<img src="${n.img.src}" alt="" style="height:1.2em;vertical-align:-0.25em;margin-right:4px">` : n + " ";
};
const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const colour = id => colours[id] || (colours[id] = PALETTE[Object.keys(colours).length % PALETTE.length]);

function fmt(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = Math.floor(s % 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${m}:${String(r).padStart(2, "0")}`;
}

function record(status) {
  const now = Date.now();
  for (const b of status.badges) {
    if (!b.totals) continue;
    const h = history[b.badge_id] || (history[b.badge_id] = []);
    const last = h[h.length - 1];
    if (b.seen < clearedMs || last && b.seen <= last[0]) continue;  // cleared, or nothing new heard
    const point = [b.seen, b.totals.throw];
    if (last && b.seen - last[0] > GAP_MS) point.push(1);  // first point after a gap
    if (point.length === 2 && h.length > 1 && last.length === 2 && last[1] === point[1] && h[h.length - 2][1] === last[1]) last[0] = b.seen;
    else h.push(point);
    while (h.length && h[0][0] < now - KEEP_S * 1000) h.shift();
  }
}

function card(b) {
  const air = b.totals ? fmt(b.totals.throw) : "–";
  const since = b.totals ? (b.reset ? "since page reset" : "since badge reboot") : "no totals (old Airtime build)";
  const seen = b.online ? `${b.rssi} dBm` : `offline · ${Math.round(b.age)} s ago`;
  return `<div class="card${b.online ? "" : " offline"}" style="--c:${colour(b.badge_id)}">
    <div class="top"><span class="name">${badgeIcon(b.name)}${esc(b.name)}${b.online && b.state === "throw" ? '<span class="flying">IN THE AIR</span>' : ""}</span>
      <span class="meta">${b.badge_id}</span></div>
    <div class="air">${air}<small>air time</small></div>
    <div class="bottom"><span class="meta">${since} · ${seen}</span>
      <button data-id="${b.badge_id}" ${b.totals ? "" : "disabled"}>Reset</button></div>
  </div>`;
}

function render(status) {
  badges = status.badges;
  badges.forEach(b => colour(b.badge_id));
  $("grid").innerHTML = badges.map(card).join("");
  $("empty").hidden = badges.length > 0;
  const online = badges.filter(b => b.online).length;
  $("conn").textContent = `${online} online · ${badges.length} seen`;
}

function niceStep(max, n) {
  const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map(f => f * mag).find(s => s >= raw);
}

function draw() {
  const cv = $("chart"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 64, R = 30, T = 26, B = 30, pw = W - L - R, ph = H - T - B;
  const span = +$("span").value * 1000, now = Date.now(), t0 = now - span;
  const online = new Set(badges.filter(b => b.online).map(b => b.badge_id));
  const names = Object.fromEntries(badges.map(b => [b.badge_id, b.name]));
  const heads = [];

  let maxMs = 1000;
  for (const h of Object.values(history)) for (const [t, v] of h) if (t >= t0 - 5000) maxMs = Math.max(maxMs, v);
  const step = niceStep(maxMs / 1000, 5) * 1000, top = Math.ceil(maxMs / step) * step;
  const x = t => L + (t - t0) / span * pw, y = v => T + ph - v / top * ph;

  g.font = "12px system-ui, sans-serif"; g.lineWidth = 1;
  g.fillStyle = "#8b949e"; g.strokeStyle = "#30363d";
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let v = 0; v <= top + 1; v += step) {
    g.beginPath(); g.moveTo(L, y(v)); g.lineTo(W - R, y(v)); g.stroke();
    g.fillText(fmt(v), L - 8, y(v));
  }
  const tick = span <= 60000 ? 10000 : span <= 300000 ? 60000 : span <= 900000 ? 180000 : 600000;
  g.textAlign = "center"; g.textBaseline = "top";
  for (let t = Math.ceil(t0 / tick) * tick; t <= now; t += tick) {
    g.beginPath(); g.moveTo(x(t), T); g.lineTo(x(t), T + ph); g.stroke();
    g.fillText(new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: tick < 60000 ? "2-digit" : undefined}), x(t), T + ph + 8);
  }

  g.save();
  g.beginPath(); g.rect(L, T, pw, ph); g.clip();
  g.lineWidth = 2.5; g.lineJoin = "round";
  for (const [id, h] of Object.entries(history)) {
    if (!h.length) continue;
    g.strokeStyle = colour(id);
    // Solid where the badge was heard; dashed across gaps (out of range), where
    // the air time in between is unknown and drawn as a straight line.
    const solid = new Path2D(), gaps = new Path2D();
    for (let i = 0; i < h.length; i++) {
      if (i + 1 < h.length && h[i + 1][0] < t0) continue;
      const [t, v] = h[i];
      if (i === 0) { solid.moveTo(x(t), y(v)); continue; }
      const [pt, pv] = h[i - 1];
      const path = h[i][2] ? gaps : solid;
      path.moveTo(x(pt), y(pv)); path.lineTo(x(t), y(v));
    }
    const last = h[h.length - 1];
    if (online.has(id)) { solid.moveTo(x(last[0]), y(last[1])); solid.lineTo(x(now), y(last[1])); }
    g.setLineDash([]); g.stroke(solid);
    g.setLineDash([6, 6]); g.stroke(gaps); g.setLineDash([]);
    const headT = online.has(id) ? now : last[0];
    if (headT >= t0) heads.push({id, x: x(headT), y: y(last[1]), online: online.has(id), emoji: namesake(names[id])});
  }
  g.restore();

  // Line heads drawn unclipped, so an emoji at the edge isn't cut off.
  for (const h of heads) {
    g.globalAlpha = h.online ? 1 : 0.5;
    if (h.emoji && h.emoji.img) {
      if (h.emoji.img.complete) g.drawImage(h.emoji.img, h.x - 18, h.y - 18, 36, 36);
    } else if (h.emoji) {
      g.font = `30px ${EMOJI_FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(h.emoji, h.x, h.y);
    } else if (h.online) {
      g.fillStyle = colour(h.id); g.beginPath(); g.arc(h.x - 3, h.y, 4, 0, 7); g.fill();
    }
  }
  g.globalAlpha = 1;
  g.font = "12px system-ui, sans-serif";

  g.textAlign = "left"; g.textBaseline = "middle";
  let lx = L + 10;
  for (const b of badges) {
    if (!history[b.badge_id]) continue;
    g.fillStyle = colour(b.badge_id); g.fillRect(lx, T + 8, 12, 4);
    g.fillStyle = "#e6edf3"; g.fillText(b.name, lx + 18, T + 10);
    lx += g.measureText(b.name).width + 40;
  }
  requestAnimationFrame(draw);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "history") { for (const k in history) delete history[k]; Object.assign(history, m.history); clearedMs = m.cleared_ms || 0; }
    if (m.type === "status") { record(m); render(m); }
  };
  ws.onclose = () => { $("conn").textContent = "server disconnected, retrying…"; setTimeout(connect, 1000); };
}
const send = msg => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));
$("grid").onclick = e => { const b = e.target.closest("button[data-id]"); if (b) send({op: "reset", badge_id: b.dataset.id}); };
$("resetall").onclick = () => { if (confirm("Reset the air time of every badge and clear the chart?")) send({op: "reset_all"}); };
connect();
requestAnimationFrame(draw);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Air-time dashboard</title>
<style>
  /* Light theme of badger.github.io (src/styles/globals.css, :root.light). */
  :root {
    --background: hsl(140 13% 95.5%); --foreground: hsl(137 11% 7%); --card: #fff;
    --primary: hsl(137 91% 25%); --muted: hsl(140 12% 91%); --muted-foreground: hsl(138 4% 36%);
    --border: hsl(140 9% 82%); --input: hsl(140 9% 78%); --control-hover: hsl(140 12% 93%);
    --destructive: hsl(356 72% 47%); --control-danger: hsl(353 80% 97%); --control-danger-hover: hsl(353 75% 94%);
    --page-glow: rgba(15, 191, 62, 0.09); --page-sheen: rgba(255, 255, 255, 0.7); --grid-dot: rgba(8, 135, 43, 0.2);
    --surface-shadow: 0 1px 2px rgba(16, 20, 17, 0.04), 0 10px 30px rgba(16, 20, 17, 0.06);
    --sans: "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Mona Sans SemiCondensed", "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Monaspace Neon", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 0.7rem;
    color-scheme: light;
  }
  * { box-sizing: border-box; border-color: var(--border); }
  body {
    margin:0; min-width:320px; font:16px/1.6 var(--sans); color:var(--foreground); background:var(--background);
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle at 78% 0%, var(--page-glow), transparent 26rem),
      linear-gradient(180deg, var(--page-sheen), transparent 26rem);
    background-attachment: fixed;
  }
  ::selection { color:#fff; background:var(--primary); }
  header {
    position:sticky; top:0; z-index:10; height:4.5rem; padding:0 2rem; display:flex; gap:1rem; align-items:center;
    border-bottom:1px solid color-mix(in srgb, var(--border) 80%, transparent);
    background:color-mix(in srgb, var(--background) 90%, transparent); backdrop-filter:blur(24px);
  }
  header h1 { font:600 1.5rem/1 var(--display); letter-spacing:-0.025em; margin:0; display:flex; align-items:center; gap:.6rem; }
  header h1 .mark { width:2.25rem; height:2.25rem; border-radius:.6rem; display:grid; place-items:center; background:var(--foreground); }
  #conn { flex:1; }
  .eyebrow, #conn, label.meta { font:500 .68rem/1 var(--mono); text-transform:uppercase; letter-spacing:.14em; color:var(--muted-foreground); }
  label.meta { display:flex; align-items:center; gap:.5rem; }
  button, select {
    font:500 .72rem/1 var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--foreground);
    background:var(--card); border:1px solid var(--input); border-radius:calc(var(--radius) - 2px);
    height:2.5rem; padding:0 1rem; cursor:pointer; transition:border-color 150ms, background-color 150ms;
  }
  select { padding-right:.6rem; }
  button:hover:not(:disabled), select:hover { background:var(--control-hover); border-color:color-mix(in srgb, var(--primary) 60%, transparent); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:default; }
  button.danger { color:var(--destructive); background:var(--control-danger); border-color:color-mix(in srgb, var(--destructive) 35%, transparent); }
  button.danger:hover { background:var(--control-danger-hover); border-color:var(--destructive); }
  main { max-width:1400px; margin:0 auto; padding:1.5rem 2rem 2rem; }
  .surface { background:color-mix(in srgb, var(--card) 80%, transparent); border:1px solid color-mix(in srgb, var(--border) 80%, transparent); border-radius:.75rem; box-shadow:var(--surface-shadow); }
  #chartwrap { position:relative; height:min(55vh, 520px); overflow:hidden; }
  #chartwrap::before { content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle, var(--grid-dot) 1px, transparent 1px); background-size:22px 22px; mask-image:linear-gradient(180deg, black, transparent 82%); -webkit-mask-image:linear-gradient(180deg, black, transparent 82%); }
  #chart { position:relative; width:100%; height:100%; display:block; }
  .dots { height:1px; margin:1.5rem 0; background-image:radial-gradient(circle, rgba(16, 20, 17, 0.35) 1px, transparent 1px); background-size:20px 1px; background-repeat:repeat-x; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:1rem; }
  .card { padding:1rem 1.1rem; transition:border-color 200ms; }
  .card:hover { border-color:color-mix(in srgb, var(--primary) 55%, transparent); }
  .card.offline { opacity:.55; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name .pic { cursor:pointer; }
  .name { font-size:1rem; font-weight:600; letter-spacing:-0.01em; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  .swatch { width:.7rem; height:.7rem; border-radius:3px; background:var(--c); flex:none; }
  .meta { font:.65rem/1.5 var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--muted-foreground); }
  .air { margin:.75rem 0; padding-left:1rem; border-left:2px solid var(--c); }
  .air b { display:block; font:500 1.9rem/1.1 var(--mono); letter-spacing:-0.025em; font-variant-numeric:tabular-nums; color:var(--foreground); }
  .air small { display:block; margin-top:.3rem; font:.65rem/1 var(--mono); text-transform:uppercase; letter-spacing:.16em; color:var(--muted-foreground); }
  .flying { font:500 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; padding:3px 7px; border-radius:4px; border:1px solid var(--c); color:#fff; background:var(--c); }
  .bottom { display:flex; flex-direction:column; align-items:flex-start; gap:.6rem; }
  .bottom button { height:2rem; padding:0 .6rem; font-size:.65rem; }
  .actions { display:flex; gap:.35rem; flex:none; }
  #empty { color:var(--muted-foreground); font-size:.9rem; margin:0 0 1rem; }
</style>
</head>
<body>
<header>
  <h1><span class="mark" aria-hidden="true"><img id="logo" alt="" width="22" height="22"></span>Air time</h1>
  <span id="conn">connecting…</span>
  <label class="meta">window
    <select id="span">
      <option value="60">1 min</option>
      <option value="120">2 min</option>
      <option value="180">3 min</option>
      <option value="240">4 min</option>
      <option value="300" selected>5 min</option>
      <option value="600">10 min</option>
    </select>
  </label>
  <button id="sound" title="Play each plushie's sound while it is in the air, and UGF when one is dropped">Sound off</button>
  <button id="resetall" class="danger">Reset all</button>
</header>
<main>
  <div id="chartwrap" class="surface"><canvas id="chart"></canvas></div>
  <div class="dots"></div>
  <p id="empty">Looking for badges… They need the Wi-Fi Airtime app on the same network as this computer.</p>
  <div id="grid"></div>
</main>
<script>
const PALETTE = ["#08872B", "#0969da", "#bc4c00", "#8250df", "#bf3989", "#cf222e", "#1b7c83", "#9a6700", "#5A615C", "#3192aa"];
const KEEP_S = 3600;
const GAP_MS = 5000;     // matches the server's OFFLINE_S
const LIVE_MAX_MS = 3000; // longest a flight is extended past the last report
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const nameOf = {};       // badge_id -> last known name
const history = {};      // badge_id -> [[time_ms, air_ms], ...]
let badges = [], ws, clearedMs = 0;

// A badge named after an animal gets its picture at the head of its chart line:
// an emoji, or an image (an object with an Image) where no emoji fits.
const RUBBER_DUCK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <path d="M6 38c0-6 5-9 12-9h14c4 0 6-2 6-5h2c10 0 18 6 18 15 0 10-9 17-26 17H22C12 56 6 49 6 38z" fill="#ffd21f" stroke="#c99400" stroke-width="2"/> <path d="M24 38c4-3 12-3 16 1-2 6-12 8-18 4z" fill="#ffbf00" stroke="#c99400" stroke-width="1.5"/> <circle cx="44" cy="20" r="12" fill="#ffd21f" stroke="#c99400" stroke-width="2"/> <path d="M54 19c5-1 9 1 9 3s-4 4-9 3z" fill="#ff7a00" stroke="#c45500" stroke-width="1.5"/> <circle cx="47" cy="16" r="2.6" fill="#1b1b1b"/> <circle cx="47.9" cy="15.2" r="0.9" fill="#fff"/> </svg>`;
// GitHub Copilot mark: Primer Octicons copilot-24 (MIT, github.com/primer/octicons).
const COPILOT = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#101411"><path d="M23.922 16.992c-.861 1.495-5.859 5.023-11.922 5.023-6.063 0-11.061-3.528-11.922-5.023A.641.641 0 0 1 0 16.736v-2.869a.841.841 0 0 1 .053-.22c.372-.935 1.347-2.292 2.605-2.656.167-.429.414-1.055.644-1.517a10.195 10.195 0 0 1-.052-1.086c0-1.331.282-2.499 1.132-3.368.397-.406.89-.717 1.474-.952 1.399-1.136 3.392-2.093 6.122-2.093 2.731 0 4.767.957 6.166 2.093.584.235 1.077.546 1.474.952.85.869 1.132 2.037 1.132 3.368 0 .368-.014.733-.052 1.086.23.462.477 1.088.644 1.517 1.258.364 2.233 1.721 2.605 2.656a.832.832 0 0 1 .053.22v2.869a.641.641 0 0 1-.078.256ZM12.172 11h-.344a4.323 4.323 0 0 1-.355.508C10.703 12.455 9.555 13 7.965 13c-1.725 0-2.989-.359-3.782-1.259a2.005 2.005 0 0 1-.085-.104L4 11.741v6.585c1.435.779 4.514 2.179 8 2.179 3.486 0 6.565-1.4 8-2.179v-6.585l-.098-.104s-.033.045-.085.104c-.793.9-2.057 1.259-3.782 1.259-1.59 0-2.738-.545-3.508-1.492a4.323 4.323 0 0 1-.355-.508h-.016.016Zm.641-2.935c.136 1.057.403 1.913.878 2.497.442.544 1.134.938 2.344.938 1.573 0 2.292-.337 2.657-.751.384-.435.558-1.15.558-2.361 0-1.14-.243-1.847-.705-2.319-.477-.488-1.319-.862-2.824-1.025-1.487-.161-2.192.138-2.533.529-.269.307-.437.808-.438 1.578v.021c0 .265.021.562.063.893Zm-1.626 0c.042-.331.063-.628.063-.894v-.02c-.001-.77-.169-1.271-.438-1.578-.341-.391-1.046-.69-2.533-.529-1.505.163-2.347.537-2.824 1.025-.462.472-.705 1.179-.705 2.319 0 1.211.175 1.926.558 2.361.365.414 1.084.751 2.657.751 1.21 0 1.902-.394 2.344-.938.475-.584.742-1.44.878-2.497Z"/><path d="M14.5 14.25a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1Zm-5 0a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1Z"/></svg>`;
const image = svg => { const i = new Image(); i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); return i; };
// Squirrel: Twemoji 1f43f (CC-BY 4.0, github.com/jdecked/twemoji); also the badge's assets/squirrel.png.
const SQUIRREL = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#AD743D" d="M35.432 22.773c-.195.858-.638 1.773-1.022 2.159 1.399-4.418 1.399-9.111-2.25-11.167.112 1.107-.11 1.691-.265 2.153-.21-2.219-.578-3.744-2.158-4.927-1.82-1.363-2.611-.452-.736 3.765 2.2 4.945 1.475 8.603.827 11.216-.038.154-.08.29-.12.439.804-5.765-.989-11.722-6.825-14.915-2.989-1.636-5.211-1.852-5.329-3.037-.135-1.377-1.218-3.698-3.811-5.327.444-1.309-.485-2.787-1.117-2.841-.631-.054-2.024 1.039-2.16 2.528-4.694 1.399-9.492 7.219-9.345 8.397.148 1.177.341 2.638 6.57 3.656 1.104.18 3.995 1.835 4.4 5.779.456 4.44 2.276 8.054 4.712 11.216h-1.73c-4.132 0-4.132 4.132-1.377 4.132h10.928l-.002-.002c.36-.003.788-.029 1.304-.085 6.931-.612 10.792-7.349 9.506-13.139z"/><path fill="#D99E82" d="M11.325 15.279c3.258-.09 4.524-6.049-.682-6.82-.122-1.077-.763-2.614-2.257-2.724-2.348-.173-5.294 2.116-6.099 7.478.881.601 2.467 1.18 5.405 1.661 1.104.18 3.995 1.835 4.4 5.779.531 5.174 2.914 9.224 5.966 12.747.903-.94 1.636-2.325 2.028-4.285 1.378-6.886-7.384-12.458-8.761-13.836z"/><circle fill="#292F33" cx="7.692" cy="9.459" r="1.377"/><path fill="#662113" d="M21.254 13.564c4.065 3.341 6.158 7.296 5.402 12.37-.318 2.143.83 2.933 1.688.902.599-1.423.936-9.887-6.05-14.311-1.859-1.177-1.961.284-1.04 1.039z"/><path fill="#AD743D" d="M13.234 19.676c-1.243-1.243-4.97 0-6.211-2.488-.786-1.572-3.728 1.245-2.485 3.734 1.242 2.483 4.969 2.483 7.454 1.242 2.485-1.242 1.242-2.488 1.242-2.488z"/><path fill="#662113" d="M6.26 20.146c.304 1.49-.383 4.295-1.874 4.6-1.49.304-3.22-2.007-3.524-3.496-.304-1.49.658-2.947 2.147-3.253 1.492-.305 2.946.659 3.251 2.149z"/><path fill="#AD743D" d="M13.907 21.375c-1.635-1.062-5.388 1.148-7.309-1.259-1.215-1.523-3.753 2.209-1.832 4.615 1.921 2.405 5.962 1.543 8.368-.378 2.407-1.92.773-2.978.773-2.978z"/></svg>`;
// GitHub Octocat (Mona): Primer Octicons mark-github-24 (MIT, github.com/primer/octicons).
const OCTOCAT = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="#101411"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>`;

const NAMESAKES = [
  ["copilot", {img: image(COPILOT)}],
  ["mona", {img: image(OCTOCAT)}], ["octocat", {img: image(OCTOCAT)}],
  ["duck", {img: image(RUBBER_DUCK)}], ["squirrel", {img: image(SQUIRREL)}], ["bear", "🐻"], ["bunny", "🐰"], ["rabbit", "🐰"],
  ["octo", "🐙"], ["cat", "🐱"], ["dog", "🐶"], ["fox", "🦊"], ["owl", "🦉"], ["frog", "🐸"],
  ["penguin", "🐧"], ["panda", "🐼"], ["unicorn", "🦄"], ["dino", "🦖"], ["monkey", "🐵"],
  ["pig", "🐷"], ["chick", "🐥"], ["whale", "🐳"], ["turtle", "🐢"], ["hedgehog", "🦔"],
];
const namesake = name => (NAMESAKES.find(([k]) => String(name).toLowerCase().includes(k)) || [])[1];
const badgeIcon = name => {
  const n = namesake(name);
  if (!n) return "";
  return n.img ? `<img src="${n.img.src}" alt="" style="height:1.2em;vertical-align:-0.25em;margin-right:4px">` : n + " ";
};
const css = getComputedStyle(document.documentElement);
const SANS = css.getPropertyValue("--sans"), MONO = css.getPropertyValue("--mono");
const INK = {text: "#101411", muted: css.getPropertyValue("--muted-foreground"), grid: "rgba(16, 20, 17, 0.09)"};
$("logo").src = image(OCTOCAT.replace('fill="#101411"', 'fill="#5FED83"')).src;
const EMOJI_FONT = '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
// Each badge keeps one colour everywhere, matching its own screen
// (PALETTE and SWATCH mirror badge/apps/airtime/__init__.py).
const SWATCH = [["copilot", 1], ["mona", 3], ["octocat", 3], ["duck", 2], ["squirrel", 4]];
const colour = id => {
  const hit = SWATCH.find(([k]) => String(nameOf[id] || "").toLowerCase().includes(k));
  return PALETTE[hit ? hit[1] : parseInt(id, 16) % PALETTE.length];
};

function fmt(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + " s";
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = Math.floor(s % 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${m}:${String(r).padStart(2, "0")}`;
}

function record(status) {
  const now = Date.now();
  for (const b of status.badges) {
    if (!b.totals) continue;
    const h = history[b.badge_id] || (history[b.badge_id] = []);
    const last = h[h.length - 1];
    if (b.seen < clearedMs || last && b.seen <= last[0]) continue;  // cleared, or nothing new heard
    const point = [b.seen, b.totals.throw];
    if (last && b.seen - last[0] > GAP_MS) point.push(1);  // first point after a gap
    if (point.length === 2 && h.length > 1 && last.length === 2 && last[1] === point[1] && h[h.length - 2][1] === last[1]) last[0] = b.seen;
    else h.push(point);
    while (h.length && h[0][0] < now - KEEP_S * 1000) h.shift();
  }
}

// While a badge last reported being in the air, its air time keeps rising in
// real time until the next report replaces the estimate.
const extra = (b, now) => b && b.online && b.state === "throw" && b.totals ? Math.min(Math.max(0, now - b.seen), LIVE_MAX_MS) : 0;
const liveAir = (b, now) => b.totals.throw + extra(b, now);

function card(b) {
  const air = b.totals ? fmt(liveAir(b, Date.now())) : "–";
  const since = b.totals ? (b.reset ? "since page reset" : "since badge reboot") : "no totals (old Airtime build)";
  const seen = b.online ? `${b.rssi} dBm` : `offline · ${Math.round(b.age)} s ago`;
  return `<div class="card surface${b.online ? "" : " offline"}" style="--c:${colour(b.badge_id)}">
    <div class="top"><span class="name"><span class="swatch"></span><span class="pic" data-sound="${b.badge_id}" title="Play ${esc(b.name)}'s sound (Shift-click: its drop sound)">${badgeIcon(b.name)}</span>${esc(b.name)}${b.online && b.state === "throw" ? '<span class="flying">In the air</span>' : ""}</span>
      <span class="meta">${b.badge_id}</span></div>
    <div class="air"><b data-air="${b.badge_id}">${air}</b><small>air time</small></div>
    <div class="bottom"><span class="meta">${since} · ${seen}</span>
      <span class="actions"><button data-identify="${b.badge_id}" title="Flash the badge's screen" ${b.online ? "" : "disabled"}>Find</button><button data-rename="${b.badge_id}" title="Rename the badge" ${b.online ? "" : "disabled"}>Rename</button><button data-id="${b.badge_id}" ${b.totals ? "" : "disabled"}>Reset</button></span></div>
  </div>`;
}

// Sounds of delight, played by this computer while a plushie is in the air.
// Each is synthesised with Web Audio, so there are no files to serve.
let audio, master;
let soundOn = localStorage.getItem("airtime-sound") === "on";
function ctx() {
  if (!audio) {
    audio = new AudioContext();
    const comp = audio.createDynamicsCompressor();
    master = audio.createGain(); master.gain.value = 0.5;
    master.connect(comp); comp.connect(audio.destination);
  }
  if (audio.state === "suspended") audio.resume();
  return audio;
}
// One note: a pitch sweep through (time, Hz) points with a quick attack and decay.
function note(t, dur, freqs, {type = "sine", vol = 0.3, filter, out: dest = master} = {}) {
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = type;
  freqs.forEach(([dt, f], i) => i ? o.frequency.exponentialRampToValueAtTime(f, t + dt) : o.frequency.setValueAtTime(f, t + dt));
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.015, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let out = o;
  if (filter) { const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = filter; f.Q.value = 2; o.connect(f); out = f; }
  out.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.02);
}
// [name key, play(t, out), seconds between repeats while the plushie flies]
const duck = (t, out) => [0, 0.17].forEach((d, i) => note(t + d, 0.15, [[0, 950 + i * 120], [0.05, 1500 + i * 150], [0.15, 1050]], {type: "sawtooth", vol: 0.22, filter: 1400, out}));
const mona = (t, out) => [[0, 260, 620], [0.11, 340, 820], [0.22, 450, 1150], [0.36, 520, 1500]].forEach(([d, f0, f1]) => note(t + d, 0.12, [[0, f0], [0.1, f1]], {vol: 0.3, out}));
const SOUNDS = [
  // A rubber duck squeezed twice: squee-squee!
  ["duck", duck, 0.42],
  // A happy squirrel chitter: quick falling chirps.
  ["squirrel", (t, out) => [0, 0.055, 0.11, 0.165, 0.22, 0.3].forEach((d, i) => note(t + d, 0.045, [[0, 3400 - i * 120], [0.045, 2300]], {vol: 0.22, out})), 0.4],
  // Copilot: a sparkly rising arpeggio with a shimmer on top.
  ["copilot", (t, out) => { [523, 659, 784, 1047, 1319].forEach((f, i) => note(t + i * 0.06, 0.35, [[0, f]], {type: "triangle", vol: 0.25, out}));
    note(t + 0.3, 0.5, [[0, 2093], [0.5, 2637]], {vol: 0.08, out}); }, 0.6],
  // Mona the Octocat: bubbly bloops rising out of the deep.
  ["mona", mona, 0.52],
  ["octocat", mona, 0.52],
];
// Anyone else gets a "wheee!" slide, pitched by their id so badges differ.
function wheee(t, id, out = master) {
  const base = 380 + (parseInt(id, 16) % 7) * 45;
  note(t, 0.5, [[0, base], [0.35, base * 3], [0.5, base * 2.6]], {type: "triangle", vol: 0.25, out});
}
// White noise for breathy sounds; one second, made once.
let noiseBuf;
function noise(t, dur, {filter = 3500, q = 1.2, vol = 0.2, out: dest = master} = {}) {
  const a = ctx();
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf;
  f.type = "bandpass"; f.frequency.value = filter; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur + 0.02);
}
// A dropped plushie says "UGF!": a thud, a falling "uh" grunt and a breathy
// "f". Pitched a little per badge so drops at once can be told apart.
function ugf(t, id) {
  const k = 0.85 + (parseInt(id, 16) % 7) * 0.05;
  note(t, 0.14, [[0, 130 * k], [0.12, 48 * k]], {vol: 0.5});
  note(t + 0.03, 0.24, [[0, 200 * k], [0.08, 175 * k], [0.24, 115 * k]], {type: "sawtooth", vol: 0.35, filter: 620});
  note(t + 0.03, 0.22, [[0, 400 * k], [0.22, 240 * k]], {type: "sawtooth", vol: 0.12, filter: 1100});
  noise(t + 0.2, 0.18, {filter: 3200, q: 0.8, vol: 0.7});
}
function oof(b) {
  if (!audio && !soundOn) return;
  ugf(ctx().currentTime + 0.02, b.badge_id);
}
function soundOf(b) {
  const key = String(b.name).toLowerCase(), s = SOUNDS.find(([k]) => key.includes(k));
  return s ? {play: s[1], period: s[2]} : {play: (t, out) => wheee(t, b.badge_id, out), period: 0.55};
}
function delight(b) {
  if (!audio && !soundOn) return;
  soundOf(b).play(ctx().currentTime + 0.02, master);
}
// A flying plushie's sound repeats until it lands. Each badge plays through its
// own gain bus, so plushies in the air together overlap, and a landing fades
// out only that badge.
const LOOP_AHEAD_S = 0.15, LOOP_STALE_MS = 3000;  // same live cap as the chart
const loops = {};        // badge_id -> {bus, sound, next, seen}
function startLoop(b) {
  const l = loops[b.badge_id];
  if (l) { l.seen = Date.now(); return; }
  const a = ctx(), bus = a.createGain();
  bus.connect(master);
  loops[b.badge_id] = {bus, sound: soundOf(b), next: a.currentTime + 0.02, seen: Date.now()};
  pumpLoops();
}
function stopLoop(id) {
  const l = loops[id];
  if (!l) return;
  delete loops[id];
  l.bus.gain.setTargetAtTime(0, audio.currentTime, 0.06);
  setTimeout(() => l.bus.disconnect(), 800);
}
function pumpLoops() {
  if (!audio) return;
  for (const [id, l] of Object.entries(loops)) {
    if (!soundOn || Date.now() - l.seen > LOOP_STALE_MS) { stopLoop(id); continue; }
    for (; l.next < audio.currentTime + LOOP_AHEAD_S; l.next += l.sound.period) {
      l.sound.play(Math.max(l.next, audio.currentTime + 0.01), l.bus);
    }
  }
}
setInterval(pumpLoops, 50);
function showSound() {
  const live = soundOn && audio && audio.state === "running";
  $("sound").textContent = !soundOn ? "Sound off" : live ? "Sound on" : "Click for sound";
}

// A badge in the throw state loops its sound. A lost datagram can hide a short
// flight, so a rise in air time while not flying plays the sound once.
// A change in a badge's drop counter on the same boot plays "UGF" once; badges
// without the counter (old builds) use the switch into the drop state instead.
const flight = {};       // badge_id -> {flying, air, at}
const dropSeen = {};     // badge_id -> {boot, drops, state}
function listen(status) {
  for (const b of status.badges) {
    const d = dropSeen[b.badge_id];
    if (d && soundOn && b.online && d.boot === b.boot &&
        (b.drops != null ? d.drops != null && b.drops !== d.drops : b.state === "drop" && d.state !== "drop")) oof(b);
    dropSeen[b.badge_id] = {boot: b.boot, drops: b.drops, state: b.state};
    const was = flight[b.badge_id], air = b.totals ? b.totals.throw : 0;
    const flying = b.online && b.state === "throw";
    const now = Date.now();
    if (was && soundOn && flying) startLoop(b);
    else stopLoop(b.badge_id);
    if (was && b.online && !flying && !was.flying && air > was.air && now - was.at > 2500) {
      if (soundOn) delight(b);
      flight[b.badge_id] = {flying, air, at: now};
    } else flight[b.badge_id] = {flying, air, at: flying ? now : was ? was.at : 0};
  }
}

function render(status) {
  listen(status);
  badges = status.badges;
  badges.forEach(b => { nameOf[b.badge_id] = b.name; });
  $("grid").innerHTML = badges.map(card).join("");
  $("empty").hidden = badges.length > 0;
  const online = badges.filter(b => b.online).length;
  $("conn").textContent = `${online} online · ${badges.length} seen`;
}

function niceStep(max, n) {
  const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map(f => f * mag).find(s => s >= raw);
}

function draw() {
  const cv = $("chart"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 64, R = 30, T = 26, B = 30, pw = W - L - R, ph = H - T - B;
  const span = +$("span").value * 1000, now = Date.now(), t0 = now - span;
  const online = new Set(badges.filter(b => b.online).map(b => b.badge_id));
  const names = Object.fromEntries(badges.map(b => [b.badge_id, b.name]));
  const byId = Object.fromEntries(badges.map(b => [b.badge_id, b]));
  for (const b of badges) if (extra(b, now)) { const el = document.querySelector(`[data-air="${b.badge_id}"]`); if (el) el.textContent = fmt(liveAir(b, now)); }
  const heads = [];

  let maxMs = 1000;
  for (const [id, h] of Object.entries(history)) {
    for (const [t, v] of h) if (t >= t0 - 5000) maxMs = Math.max(maxMs, v);
    if (h.length) maxMs = Math.max(maxMs, h[h.length - 1][1] + extra(byId[id], now));
  }
  const step = niceStep(maxMs / 1000, 5) * 1000, top = Math.ceil(maxMs / step) * step;
  const x = t => L + (t - t0) / span * pw, y = v => T + ph - v / top * ph;

  g.font = `11px ${MONO}`; g.lineWidth = 1;
  g.fillStyle = INK.muted; g.strokeStyle = INK.grid;
  g.textAlign = "right"; g.textBaseline = "middle";
  for (let v = 0; v <= top + 1; v += step) {
    g.beginPath(); g.moveTo(L, y(v)); g.lineTo(W - R, y(v)); g.stroke();
    g.fillText(fmt(v), L - 8, y(v));
  }
  const tick = span <= 60000 ? 10000 : span <= 180000 ? 30000 : span <= 300000 ? 60000 : 120000;
  g.textAlign = "center"; g.textBaseline = "top";
  for (let t = Math.ceil(t0 / tick) * tick; t <= now; t += tick) {
    g.beginPath(); g.moveTo(x(t), T); g.lineTo(x(t), T + ph); g.stroke();
    g.fillText(new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: tick < 60000 ? "2-digit" : undefined}), x(t), T + ph + 8);
  }

  g.save();
  g.beginPath(); g.rect(L, T, pw, ph); g.clip();
  g.lineWidth = 2.5; g.lineJoin = "round";
  for (const [id, h] of Object.entries(history)) {
    if (!h.length) continue;
    g.strokeStyle = colour(id);
    // Solid where the badge was heard; dashed across gaps (out of range), where
    // the air time in between is unknown and drawn as a straight line.
    const solid = new Path2D(), gaps = new Path2D();
    for (let i = 0; i < h.length; i++) {
      if (i + 1 < h.length && h[i + 1][0] < t0) continue;
      const [t, v] = h[i];
      if (i === 0) { solid.moveTo(x(t), y(v)); continue; }
      const [pt, pv] = h[i - 1];
      const path = h[i][2] ? gaps : solid;
      path.moveTo(x(pt), y(pv)); path.lineTo(x(t), y(v));
    }
    const last = h[h.length - 1];
    const up = extra(byId[id], now), headV = last[1] + up;
    if (online.has(id)) {
      solid.moveTo(x(last[0]), y(last[1]));
      if (up) solid.lineTo(x(last[0] + up), y(headV));  // rising live at 1 s per s
      solid.lineTo(x(now), y(headV));
    }
    g.setLineDash([]); g.stroke(solid);
    g.setLineDash([6, 6]); g.stroke(gaps); g.setLineDash([]);
    const headT = online.has(id) ? now : last[0];
    if (headT >= t0) heads.push({id, x: x(headT), y: y(online.has(id) ? headV : last[1]), online: online.has(id), emoji: namesake(names[id])});
  }
  g.restore();

  // Line heads drawn unclipped, so an emoji at the edge isn't cut off.
  for (const h of heads) {
    g.globalAlpha = h.online ? 1 : 0.5;
    if (h.emoji && h.emoji.img) {
      if (h.emoji.img.complete) g.drawImage(h.emoji.img, h.x - 18, h.y - 18, 36, 36);
    } else if (h.emoji) {
      g.font = `30px ${EMOJI_FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(h.emoji, h.x, h.y);
    } else if (h.online) {
      g.fillStyle = colour(h.id); g.beginPath(); g.arc(h.x - 3, h.y, 4, 0, 7); g.fill();
    }
  }
  g.globalAlpha = 1;
  g.font = `600 12px ${SANS}`;

  g.textAlign = "left"; g.textBaseline = "middle";
  let lx = L + 10;
  for (const b of badges) {
    if (!history[b.badge_id]) continue;
    g.fillStyle = colour(b.badge_id); g.fillRect(lx, T + 8, 12, 4);
    g.fillStyle = INK.text; g.fillText(b.name, lx + 18, T + 10);
    lx += g.measureText(b.name).width + 40;
  }
  requestAnimationFrame(draw);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "history") { for (const k in history) delete history[k]; Object.assign(history, m.history); clearedMs = m.cleared_ms || 0; }
    if (m.type === "status") { record(m); render(m); }
  };
  ws.onclose = () => { $("conn").textContent = "server disconnected, retrying…"; setTimeout(connect, 1000); };
}
const send = msg => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));
$("grid").onclick = e => {
  const b = e.target.closest("button[data-id]");
  if (b) send({op: "reset", badge_id: b.dataset.id});
  const f = e.target.closest("button[data-identify]");
  if (f) send({op: "identify", badge_id: f.dataset.identify});
  const r = e.target.closest("button[data-rename]");
  if (r) {
    const old = (badges.find(x => x.badge_id === r.dataset.rename) || {}).name || "";
    const name = (prompt("New name for " + old + " (up to 16 characters)", old) || "").trim().slice(0, 16);
    if (name && name !== old) send({op: "rename", badge_id: r.dataset.rename, name});
  }
  const p = e.target.closest("[data-sound]");
  if (p) { const badge = badges.find(x => x.badge_id === p.dataset.sound); ctx(); if (badge) (e.shiftKey ? oof : delight)(badge); showSound(); }
};
$("sound").onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem("airtime-sound", soundOn ? "on" : "off");
  if (soundOn) { ctx(); wheee(audio.currentTime + 0.02, "0"); }
  showSound();
};
// Browsers start audio suspended until the page is clicked.
document.addEventListener("pointerdown", () => { if (soundOn) ctx(); setTimeout(showSound, 50); });
showSound();
$("resetall").onclick = () => { if (confirm("Reset the air time of every badge and clear the chart?")) send({op: "reset_all"}); };
connect();
requestAnimationFrame(draw);
</script>
</body>
</html>
